# 项目构建配置
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 库版本与 groupId 单一来源（发布契约）：publishing.gradle.kts 与 verifyLibraryVersions 守护任务消费
# groupId=Maven Central 已验证命名空间（GitHub 验证，全小写）；JitPack 通道经 -Plkanvas.groupId= 重映射
# 注意：凭据（central.* / signing.*）只放 local.properties（gitignored），严禁写进本文件
lkanvas.version=0.16.0-beta01
lkanvas.groupId=io.github.iamkings
