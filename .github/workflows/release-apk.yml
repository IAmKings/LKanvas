# 发版自动出 demo APK：推 v* tag 或手动触发时，构建 app-sample R8 release
# 并挂到同名 GitHub Release（Releases 页直接下载安装，免构建试用）。
# - 仅 v* 前缀 tag 触发；无 v 前缀的 JitPack 通道 tag 不触发，避免双构建
# - APK 为 debug 签名（仓库既有内测惯例，生产签名后置），可直接侧载
# - 版本单一来源：gradle.properties 的 lkanvas.version（APK 命名与 Release 文案读取）
name: release-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build demo APK (app-sample R8 release)
        run: ./gradlew :app-sample:assembleRelease --stacktrace

      - name: Rename APK by lkanvas.version
        run: |
          VERSION="$(grep '^lkanvas.version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          APK_SOURCE="$(ls app-sample/build/outputs/apk/release/*.apk | head -1)"
          echo "APK source: ${APK_SOURCE}"
          mkdir -p dist
          cp "$APK_SOURCE" "dist/LKanvas-sample-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKanvas-sample-${{ env.VERSION }}
          path: dist/*.apk
          retention-days: 14

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            BODY="$(cat <<'EOF'
          ## LKanvas 内测版

          - 示例应用 APK：R8 release 构建，debug 签名，下载后允许安装未知来源即可侧载
          - 作为库接入（Maven Central / JitPack / GitHub Packages）见 README「接入」章节
          - 内测期 API 可能随 rc 调整；问题请提 issue（附环境与 `LKanvasChart.version()`）

          本 Release 由 [release-apk workflow](.github/workflows/release-apk.yml) 在 tag 推送时自动构建发布。
          EOF
          )"
            gh release create "$TAG" --title "LKanvas $TAG" --notes "$BODY"
          fi
          gh release upload "$TAG" dist/*.apk --clobber
